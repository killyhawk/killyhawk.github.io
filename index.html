<style>
/* Bastardo Grotesk — licensed webfont (Giulia Boggio) */
@font-face{
  font-family:'Bastardo Grotesk';
  src:url('assets/fonts/BastardoGrotesk-Regular.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Bastardo Grotesk';
  src:url('assets/fonts/BastardoGrotesk-Semibold.woff2') format('woff2');
  font-weight:600;font-style:normal;font-display:swap;
}

:root{
  --forest:#262A29;
  --stone:#DDDACB;
  --sage:#8B9E8A;
  --gold:#C4A87D;
  --umber:#7A5C4F;
  --storm:#6E7F8C;
  --rule:rgba(38,42,41,.16);
  --font-display:'Bastardo Grotesk','Space Grotesk',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--stone);
  color:var(--forest);
  font-family:var(--font-body);
  font-size:1.0625rem;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

h1{
  font-family:var(--font-display);
  font-weight:400;
  letter-spacing:-0.02em;
  line-height:1.04;
  color:var(--forest);
  font-size:clamp(2.4rem,6.8vw,5rem);
  max-width:16ch;
}

a{color:var(--forest);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--forest);outline-offset:3px}

.wrap{max-width:1060px;margin:0 auto;padding:0 24px}

.kicker{
  font-family:var(--font-body);
  font-weight:600;
  font-size:.8rem;
  letter-spacing:.18em;
  text-transform:uppercase;
}

nav{padding:26px 0;border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;align-items:center;justify-content:space-between}
nav img{height:28px;width:auto;display:block}

.hero{padding:48px 0 12px;position:relative;overflow:hidden}
.hero p.sub{margin-top:14px;font-size:1.15rem;max-width:52ch}
.hero p.tagline{margin-top:20px;font-size:1.25rem;font-weight:500}
.cta-row{margin-top:32px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{
  display:inline-block;
  background:var(--gold);
  color:var(--forest);
  font-weight:600;font-size:.9rem;letter-spacing:.02em;
  padding:15px 30px;border-radius:2px;
  transition:background .15s ease,color .15s ease;
}
.btn:hover{text-decoration:none;background:var(--forest);color:var(--stone)}
.btn-ghost{background:transparent;color:var(--forest);border:1px solid var(--forest);padding:14px 29px}
.btn-ghost:hover{background:var(--forest);color:var(--stone);border-color:var(--forest)}

#clients{padding:36px 0 48px}
#clients .kicker{color:var(--forest);margin-bottom:14px}

/* Logo grid: borderless tiles */
.wall{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:0;
  max-width:680px;
}
.wall a{
  position:relative;
  min-height:84px;
  display:flex;align-items:center;justify-content:center;
  background:var(--stone);
  padding:10px 8px 18px;
  color:var(--forest);
  transition:background .15s ease;
}
.wall a:hover{text-decoration:none;background:rgba(38,42,41,.08)}
.wall a img{
  display:block;
  height:calc(var(--h,30px) * .88);
  max-width:150px;
  width:auto;
}
.wall a small{
  position:absolute;left:0;right:0;bottom:5px;
  text-align:center;
  font-family:var(--font-body);
  color:var(--storm);
  font-size:.7rem;letter-spacing:0;line-height:1.2;
}

.partners{margin-top:24px;color:var(--storm);font-size:.95rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.partners strong{color:var(--forest);font-weight:500}
.partners a{color:var(--storm);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:6px}
.partners a img{height:16px;width:auto;display:block}

footer{background:var(--forest);color:var(--stone);padding:48px 0 44px;margin-top:auto}
.foot-meta{
  font-size:.9rem;color:var(--stone);
}
.foot-meta img{height:22px;display:block}
.foot-meta p{opacity:.7;font-size:.85rem;margin-top:10px}

@media (max-width:640px){
  #clients{padding-top:28px}
  .cta-row{margin-top:24px}
  nav img{height:23px}
  .hero{padding:40px 0 12px}
  .wall{grid-template-columns:repeat(2,1fr);max-width:none}
  .wall a{min-height:80px;padding:10px 8px 20px}
  .wall a small{bottom:6px;font-size:.68rem}
  .wall a img{max-width:140px;height:calc(var(--h,30px) * .85)}
}
</style>
</head>

      <a href="https://term.finance" target="_blank" rel="noopener" style="--h:42px"><img src="assets/logos/termfinance.svg" alt="Term Finance"></a>
      <a href="https://symm.io" target="_blank" rel="noopener" style="--h:34px"><img src="assets/logos/symmio.svg" alt="Symmio"></a>

</section>

<footer>
  <div class="wrap">
    <div class="foot-meta">
      <div>
        <img src="assets/lockup.png" alt="Killyhawk">
        <p>Effective Communication for Frontier Tech<br>© Killyhawk 2026</p>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
